name: BISIG Maintenance

on:
  schedule:
    # 16:00 UTC = 12:00 AM Asia/Manila
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wake service and run due maintenance
        env:
          MAINTENANCE_URL: ${{ secrets.MAINTENANCE_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MAINTENANCE_URL"
          test -n "$MAINTENANCE_TOKEN"

          endpoint="${MAINTENANCE_URL%/}/internal/maintenance/run"

          # Render Free may need time to wake. Retry for several minutes.
          curl --fail-with-body \
            --retry 8 \
            --retry-delay 20 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 600 \
            -X POST "$endpoint" \
            -H "Accept: application/json" \
            -H "X-Maintenance-Token: $MAINTENANCE_TOKEN"
