name: linter

on:
  push:
    branches:
      - develop
      - main
      - production
  pull_request:
    branches:
      - develop
      - main
      - production

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Check PHP style in changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && ! [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --name-only --diff-filter=ACM -z "$BASE_SHA" HEAD -- '*.php' | xargs -0 -r vendor/bin/pint --test
          else
            git diff --name-only --diff-filter=ACM -z HEAD~1 HEAD -- '*.php' | xargs -0 -r vendor/bin/pint --test
          fi
